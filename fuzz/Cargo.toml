# Fuzz targets of the network parsers (full review, Phase 2). Own workspace, as
# cargo-fuzz expects: `cargo +nightly fuzz run <target>` from this folder.
[package]
name = "nuvira-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
nuvira-proto = { path = "../client/proto" }
nuvira-transport = { path = "../client/transport" }
nuvira-update = { path = "../client/update" }
nuvira-secret = { path = "../client/secret" }
prost = "0.14"
serde_json = "1"

[workspace]
members = ["."]

[[bin]]
name = "framing_decoder"
path = "fuzz_targets/framing_decoder.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fec_receiver"
path = "fuzz_targets/fec_receiver.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fec_receiver_bounded"
path = "fuzz_targets/fec_receiver_bounded.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fec_round_trip"
path = "fuzz_targets/fec_round_trip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proto_messages"
path = "fuzz_targets/proto_messages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "update_manifest"
path = "fuzz_targets/update_manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "text_inputs"
path = "fuzz_targets/text_inputs.rs"
test = false
doc = false
bench = false
