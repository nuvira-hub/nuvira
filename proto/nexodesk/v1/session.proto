// Messaggi scambiati dentro una sessione tra il dispositivo che controlla
// (viewer) e quello controllato (agent). Vedi docs/11-protocollo.md.
//
// Regole: i campi si aggiungono e non si riutilizzano mai; i messaggi
// sconosciuti vengono ignorati.

syntax = "proto3";

package nexodesk.v1;

// La versione negoziata è la più alta comune ai due lati.
enum ProtocolVersion {
  PROTOCOL_VERSION_UNSPECIFIED = 0;
  // Prototipo della fase 0: solo LAN, nessuna autenticazione.
  PROTOCOL_VERSION_0 = 1;
}

enum Codec {
  CODEC_UNSPECIFIED = 0;
  CODEC_H264 = 1;
}

// Canale `control` (stream bidirezionale aperto dal viewer).
message ControlMessage {
  oneof msg {
    Hello hello = 1;
    VideoFormat video_format = 2;
    Ping ping = 3;
    Pong pong = 4;
    RequestKeyframe request_keyframe = 5;
    Auth auth = 6;
    AuthResult auth_result = 7;
    Feedback feedback = 8;
    Displays displays = 9;
    SelectDisplay select_display = 10;
    SetQuality set_quality = 11;
    Clipboard clipboard = 12;
    Chat chat = 13;
    FileReceived file_received = 14;
  }
}

// Dall'agent, alla fine di ogni file ricevuto (vedi FileChunk).
message FileReceived {
  string name = 1;
  bool ok = 2;
  // Con ok: dove è stato salvato (es. "Download"); altrimenti il motivo.
  string message = 3;
}

// Canale `file` (stream unidirezionale viewer -> agent, uno per file, aperto dopo
// quello dell'input). Il primo messaggio porta nome e dimensione, i successivi
// solo i dati (al massimo 256 KB ciascuno). La fine dello stream chiude il file.
message FileChunk {
  string name = 1;
  uint64 size = 2;
  bytes data = 3;
}

// Messaggio di chat tra chi controlla e chi usa il PC (in entrambe le direzioni).
message Chat {
  string text = 1;
}

// Testo copiato negli appunti da una delle due parti, da scrivere negli appunti
// dell'altra (in entrambe le direzioni, al massimo 1 MB).
message Clipboard {
  string text = 1;
}

// Dall'agent, all'inizio della sessione e a ogni cambio: gli schermi disponibili
// e quello trasmesso.
message Displays {
  repeated DisplayInfo displays = 1;
  uint32 current = 2;
}

message DisplayInfo {
  uint32 index = 1;
  string name = 2;
  uint32 width = 3;
  uint32 height = 4;
  bool primary = 5;
}

// Dal viewer: trasmetti questo schermo (indice di DisplayInfo). L'agent risponde
// con VideoFormat e Displays aggiornati.
message SelectDisplay {
  uint32 index = 1;
}

// Dal viewer: compromesso tra nitidezza e fluidità. Il bitrate resta adattivo,
// cambiano il tetto e i frame al secondo.
enum Quality {
  QUALITY_UNSPECIFIED = 0;
  // Predefinita: bitrate massimo e fps dell'agent.
  QUALITY_BALANCED = 1;
  // Testo più nitido: bitrate massimo doppio, al più 30 fps.
  QUALITY_SHARP = 2;
  // Reti lente: bitrate massimo dimezzato, fps pieni.
  QUALITY_FAST = 3;
}

message SetQuality {
  Quality quality = 1;
}

// Dal viewer, ogni ~250 ms: cosa vede della sessione. L'agent lo usa per
// adattare il bitrate (latenza che sale = pacchetti in coda = rete satura).
message Feedback {
  // Latenza cattura→visualizzazione nell'intervallo (ms): mediana e minima.
  uint32 latency_ms_p50 = 1;
  uint32 latency_ms_min = 2;
  uint32 frames = 3;
  uint32 window_ms = 4;
}

// Password di sessione, inviata dal viewer subito dopo Hello quando l'agent la
// richiede. Viaggia solo nel canale cifrato end-to-end: il server non la vede.
message Auth {
  string password = 1;
}

message AuthResult {
  bool ok = 1;
  string message = 2;
}

message Hello {
  uint32 protocol_version = 1;
  string device_name = 2;
  string os = 3;
  string app_version = 4;
  // Solo dall'agent: il viewer deve inviare Auth prima di ricevere il video.
  bool password_required = 5;
}

// Inviato dall'agent quando inizia (o cambia) il flusso video.
message VideoFormat {
  Codec codec = 1;
  uint32 width = 2;
  uint32 height = 3;
}

// Stima di RTT e differenza tra gli orologi dei due dispositivi.
message Ping {
  uint64 sent_us = 1;
}

message Pong {
  uint64 ping_sent_us = 1;
  // Orologio dell'agent (microsecondi dal 1970) quando ha ricevuto il Ping.
  uint64 agent_us = 2;
}

message RequestKeyframe {}

// Canale `video` (stream unidirezionale agent -> viewer).
message VideoFrame {
  uint64 seq = 1;
  // Orologio dell'agent (microsecondi dal 1970) al momento della cattura.
  uint64 capture_us = 2;
  uint32 encode_us = 3;
  bool keyframe = 4;
  bytes data = 5;
}

// Canale `input` (stream unidirezionale viewer -> agent).
message InputEvent {
  oneof event {
    MouseMove mouse_move = 1;
    MouseButton mouse_button = 2;
    MouseWheel mouse_wheel = 3;
    Key key = 4;
    SecureAttention secure_attention = 5;
  }
}

// Ctrl+Alt+Canc sul dispositivo controllato. Non si può inviare come tasti: il
// sistema del viewer lo intercetta sempre (nel viewer: Ctrl+Alt+Fine).
message SecureAttention {}

// Posizione normalizzata 0..1 rispetto allo schermo trasmesso.
message MouseMove {
  float x = 1;
  float y = 2;
}

enum Button {
  BUTTON_UNSPECIFIED = 0;
  BUTTON_LEFT = 1;
  BUTTON_RIGHT = 2;
  BUTTON_MIDDLE = 3;
  BUTTON_BACK = 4;
  BUTTON_FORWARD = 5;
}

message MouseButton {
  Button button = 1;
  bool down = 2;
}

// Rotella in unità da 120 per scatto (come WHEEL_DELTA di Windows).
message MouseWheel {
  int32 dx = 1;
  int32 dy = 2;
}

// Tasto fisico, identificato con il nome W3C di KeyboardEvent.code
// (es. "KeyA", "Enter", "ControlLeft", "MetaLeft"): indipendente dal
// layout di tastiera e uguale a quello che userà il client web.
message Key {
  string code = 1;
  bool down = 2;
}
