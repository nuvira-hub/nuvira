// Messaggi tra i dispositivi e nexodesk-server (segnalazione). Vedi docs/13-fase1-rete.md.
//
// Ogni dispositivo apre una connessione QUIC verso il server e uno stream
// bidirezionale su cui scambia ClientMessage/ServerMessage con prefisso di
// lunghezza (varint), come nel canale `control` delle sessioni.
//
// Regole: i campi si aggiungono e non si riutilizzano mai.

syntax = "proto3";

package nexodesk.v1;

option go_package = "github.com/alexbn71/NexoDesk/server/internal/pb;pb";

message ClientMessage {
  oneof msg {
    Register register = 1;
    Proof proof = 2;
    Connect connect = 3;
    Accept accept = 4;
    Reject reject = 5;
    ApiRequest api = 6;
  }
}

message ServerMessage {
  oneof msg {
    Challenge challenge = 1;
    Registered registered = 2;
    Incoming incoming = 3;
    Route route = 4;
    Error error = 5;
    ApiResponse api = 6;
  }
}

// Primo messaggio di ogni dispositivo: la sua chiave pubblica Ed25519 (32 byte).
message Register {
  bytes public_key = 1;
  string device_name = 2;
  string os = 3;
  string app_version = 4;
  uint32 protocol_version = 5;
  // Il dispositivo non è raggiungibile: non riceve richieste di collegamento
  // (viewer, app che usa la rubrica). Più connessioni con la stessa chiave
  // possono coesistere, ad esempio due finestre di sessione aperte insieme.
  bool api_only = 6;
}

// Il dispositivo dimostra di possedere la chiave privata firmando
// "nexodesk-register-v1" seguito dal nonce.
message Challenge {
  bytes nonce = 1;
}

message Proof {
  bytes signature = 1;
}

// ID di 9 cifre assegnato alla chiave pubblica (lo stesso a ogni riconnessione).
message Registered {
  string device_id = 1;
}

// Il viewer chiede di collegarsi a un dispositivo.
message Connect {
  string device_id = 1;
}

// Al dispositivo richiesto: qualcuno vuole collegarsi.
message Incoming {
  string session_id = 1;
  string viewer_id = 2;
  string viewer_name = 3;
  bytes viewer_public_key = 4;
}

message Accept {
  string session_id = 1;
}

message Reject {
  string session_id = 1;
  string reason = 2;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_VIEWER = 1;
  ROLE_AGENT = 2;
}

// A entrambi i lati, quando la sessione è accettata: come raggiungersi.
message Route {
  string session_id = 1;
  Role role = 2;
  // Chiave pubblica Ed25519 dell'altro lato: il suo certificato TLS deve usarla.
  bytes peer_public_key = 3;
  string peer_id = 4;
  // Gettone per il relay (16 byte): va inviato in RelayBind dal socket della sessione.
  bytes relay_token = 5;
}

message Error {
  string message = 1;
  // Sessione o richiesta a cui si riferisce, se c'è.
  string session_id = 2;
}

// ---------------------------------------------------------------------------
// Account e rubrica (vedi docs/17-rubrica.md). Dopo Registered il client può
// inviare ApiRequest; ogni richiesta riceve un ApiResponse con lo stesso id.
// Prima serve Login o LoginToken: l'account resta legato alla connessione.

message ApiRequest {
  uint32 id = 1;
  oneof call {
    Login login = 2;
    LoginToken login_token = 3;
    Logout logout = 4;
    GetBooks get_books = 5;
    Entry put_entry = 6;
    DeleteEntry delete_entry = 7;
    ChangePassword change_password = 8;
    // Solo amministratori.
    ListAccounts list_accounts = 9;
    PutAccount put_account = 10;
    DeleteAccount delete_account = 11;
    PutBook put_book = 12;
    DeleteBook delete_book = 13;
    // Aggiunge il dispositivo alla rubrica personale se non è in nessuna rubrica visibile.
    Entry auto_add = 14;
  }
}

message ApiResponse {
  uint32 id = 1;
  // Vuoto se la richiesta è riuscita.
  string error = 2;
  oneof result {
    Session session = 3;
    Books books = 4;
    Entry entry = 5;
    Accounts accounts = 6;
    Book book = 7;
    Account account = 8;
  }
}

message Login {
  string username = 1;
  string password = 2;
}

// Accesso ricordato dall'app: il gettone sostituisce la password.
message LoginToken {
  string token = 1;
}

// Revoca il gettone in uso.
message Logout {}

message Session {
  string token = 1;
  Account account = 2;
  // Scadenza del gettone (secondi dal 1970).
  int64 expires = 3;
}

message Account {
  int64 id = 1;
  string username = 2;
  bool admin = 3;
}

message ChangePassword {
  string old_password = 1;
  string new_password = 2;
}

// Tutte le rubriche visibili all'account, con le schede.
message GetBooks {}

message Books {
  repeated Book books = 1;
}

message Book {
  int64 id = 1;
  string name = 2;
  // Rubrica personale dell'account (una sola, non condivisibile).
  bool personal = 3;
  // Rubriche condivise: account che la vedono (solo per gli amministratori).
  repeated int64 member_ids = 4;
  repeated Entry entries = 5;
}

// Scheda di un dispositivo. Con id 0 PutEntry ne crea una nuova.
message Entry {
  int64 id = 1;
  int64 book_id = 2;
  string device_id = 3;
  string name = 4;
  string company = 5;
  string contact = 6;
  string email = 7;
  string phone = 8;
  string notes = 9;
  // In chiaro solo dentro la connessione cifrata; sul server è cifrata.
  string password = 10;
  // Ultima modifica (secondi dal 1970), impostata dal server.
  int64 updated = 11;
}

message DeleteEntry {
  int64 id = 1;
}

message ListAccounts {}

message Accounts {
  repeated Account accounts = 1;
}

// Con id 0 crea l'account; password vuota = invariata.
message PutAccount {
  int64 id = 1;
  string username = 2;
  string password = 3;
  bool admin = 4;
}

message DeleteAccount {
  int64 id = 1;
}

// Rubrica condivisa: con id 0 la crea. I membri sostituiscono quelli attuali.
message PutBook {
  int64 id = 1;
  string name = 2;
  repeated int64 member_ids = 3;
}

message DeleteBook {
  int64 id = 1;
}
