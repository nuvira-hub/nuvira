// Messages between the devices and nuvira-server (signalling). See docs/13-phase1-network.md.
//
// Every device opens a QUIC connection to the server and a bidirectional stream
// on which it exchanges length-prefixed (varint) ClientMessage/ServerMessage,
// like in the sessions' `control` channel.
//
// Rules: fields are added and never reused.

syntax = "proto3";

package nuvira.v1;

option go_package = "github.com/nuvira-hub/nuvira/server/internal/pb;pb";

message ClientMessage {
  oneof msg {
    Register register = 1;
    Proof proof = 2;
    Connect connect = 3;
    Accept accept = 4;
    Reject reject = 5;
    ApiRequest api = 6;
  }
}

message ServerMessage {
  oneof msg {
    Challenge challenge = 1;
    Registered registered = 2;
    Incoming incoming = 3;
    Route route = 4;
    Error error = 5;
    ApiResponse api = 6;
    // The rules changed (to every device connected).
    Policy policy = 7;
  }
}

// First message of every device: its Ed25519 public key (32 bytes).
message Register {
  bytes public_key = 1;
  string device_name = 2;
  string os = 3;
  string app_version = 4;
  uint32 protocol_version = 5;
  // The device is not reachable: it receives no connection requests (viewer,
  // app using the address book). Several connections with the same key can
  // coexist, for example two session windows open at the same time.
  bool api_only = 6;
}

// The device proves it holds the private key by signing "nuvira-register-v1"
// followed by the nonce.
message Challenge {
  bytes nonce = 1;
}

message Proof {
  bytes signature = 1;
}

// 9-digit ID assigned to the public key (the same at every reconnection).
message Registered {
  string device_id = 1;
  // Rules of this server for its devices (see Policy).
  Policy policy = 2;
  // Optional modules of this server (NuviraHub Pro), e.g. "pro.address_book",
  // "pro.policy": the app shows their functions only when they are listed.
  repeated string features = 3;
}

// Rules the server's administrator sets for all its devices, sent at registration
// and whenever they change. They can only restrict: a device never allows more
// than its own settings because of them.
message Policy {
  // The person at the PC must accept every session, also with the permanent password.
  bool confirm_always = 1;
  // No file transfers (send files, file manager).
  bool no_files = 2;
  // No shared clipboard.
  bool no_clipboard = 3;
}

// The viewer asks to connect to a device.
message Connect {
  string device_id = 1;
}

// To the requested device: someone wants to connect.
message Incoming {
  string session_id = 1;
  string viewer_id = 2;
  string viewer_name = 3;
  bytes viewer_public_key = 4;
}

message Accept {
  string session_id = 1;
}

message Reject {
  string session_id = 1;
  string reason = 2;
}

enum Role {
  ROLE_UNSPECIFIED = 0;
  ROLE_VIEWER = 1;
  ROLE_AGENT = 2;
}

// To both sides, when the session is accepted: how to reach each other.
message Route {
  string session_id = 1;
  Role role = 2;
  // Ed25519 public key of the other side: its TLS certificate must use it.
  bytes peer_public_key = 3;
  string peer_id = 4;
  // Relay token (16 bytes): to be sent in RelayBind from the session socket.
  bytes relay_token = 5;
}

message Error {
  string message = 1;
  // Session or request it refers to, if any.
  string session_id = 2;
}

// ---------------------------------------------------------------------------
// Accounts and address book (see docs/17-address-book.md). After Registered the
// client can send ApiRequest; every request receives an ApiResponse with the same id.
// Login or LoginToken comes first: the account stays bound to the connection.

message ApiRequest {
  uint32 id = 1;
  oneof call {
    Login login = 2;
    LoginToken login_token = 3;
    Logout logout = 4;
    GetBooks get_books = 5;
    Entry put_entry = 6;
    DeleteEntry delete_entry = 7;
    ChangePassword change_password = 8;
    // Administrators only.
    ListAccounts list_accounts = 9;
    PutAccount put_account = 10;
    DeleteAccount delete_account = 11;
    PutBook put_book = 12;
    DeleteBook delete_book = 13;
    // Adds the device to the personal address book if it is in no visible address book.
    Entry auto_add = 14;
    // Rules for the devices: anyone signed in reads them, administrators change them.
    GetPolicy get_policy = 15;
    Policy put_policy = 16;
    // Whether some devices are connected now; needs no sign-in (local address book).
    GetPresence get_presence = 17;
  }
}

message GetPolicy {}

// At most 256 IDs per request.
message GetPresence {
  repeated string device_ids = 1;
}

message Presence {
  string device_id = 1;
  bool online = 2;
  // Seconds since 1970; 0 = never on this server.
  int64 last_seen = 3;
}

message PresenceList {
  repeated Presence devices = 1;
}

message ApiResponse {
  uint32 id = 1;
  // Empty if the request succeeded.
  string error = 2;
  oneof result {
    Session session = 3;
    Books books = 4;
    Entry entry = 5;
    Accounts accounts = 6;
    Book book = 7;
    Account account = 8;
    Policy policy = 9;
    PresenceList presence = 10;
  }
}

message Login {
  string username = 1;
  string password = 2;
}

// Sign-in remembered by the app: the token replaces the password.
message LoginToken {
  string token = 1;
}

// Revokes the token in use.
message Logout {}

message Session {
  string token = 1;
  Account account = 2;
  // Token expiry (seconds since 1970).
  int64 expires = 3;
}

message Account {
  int64 id = 1;
  string username = 2;
  bool admin = 3;
}

message ChangePassword {
  string old_password = 1;
  string new_password = 2;
}

// All the address books visible to the account, with their entries.
message GetBooks {}

message Books {
  repeated Book books = 1;
}

message Book {
  int64 id = 1;
  string name = 2;
  // Personal address book of the account (only one, not shareable).
  bool personal = 3;
  // Shared address books: accounts that see it (for administrators only).
  repeated int64 member_ids = 4;
  repeated Entry entries = 5;
}

// Entry of a device. With id 0 PutEntry creates a new one.
message Entry {
  int64 id = 1;
  int64 book_id = 2;
  string device_id = 3;
  string name = 4;
  string company = 5;
  string contact = 6;
  string email = 7;
  string phone = 8;
  string notes = 9;
  // In clear only inside the encrypted connection; on the server it is encrypted.
  string password = 10;
  // Last change (seconds since 1970), set by the server.
  int64 updated = 11;
  // Filled in by the server when the books are read: the device is connected to it
  // now, or when it was last seen (seconds since 1970; 0 = never on this server).
  bool online = 12;
  int64 last_seen = 13;
  // Folder inside the book ("" = none) and free labels, for sorting and searching.
  string group = 14;
  repeated string tags = 15;
}

message DeleteEntry {
  int64 id = 1;
}

message ListAccounts {}

message Accounts {
  repeated Account accounts = 1;
}

// With id 0 creates the account; empty password = unchanged.
message PutAccount {
  int64 id = 1;
  string username = 2;
  string password = 3;
  bool admin = 4;
}

message DeleteAccount {
  int64 id = 1;
}

// Shared address book: with id 0 it is created. The members replace the current ones.
message PutBook {
  int64 id = 1;
  string name = 2;
  repeated int64 member_ids = 3;
}

message DeleteBook {
  int64 id = 1;
}
