// Messages exchanged inside a session between the controlling device (viewer)
// and the controlled one (agent). See docs/11-protocol.md.
//
// Rules: fields are added and never reused; unknown messages are ignored.

syntax = "proto3";

package nuvira.v1;

// The negotiated version is the highest one common to both sides.
enum ProtocolVersion {
  PROTOCOL_VERSION_UNSPECIFIED = 0;
  // Phase 0 prototype: LAN only, no authentication.
  PROTOCOL_VERSION_0 = 1;
  // The agent may send ConfirmationPending between Auth and AuthResult.
  PROTOCOL_VERSION_CONFIRMATION_PENDING = 2;
}

enum Codec {
  CODEC_UNSPECIFIED = 0;
  CODEC_H264 = 1;
}

// `control` channel (bidirectional stream opened by the viewer).
message ControlMessage {
  oneof msg {
    Hello hello = 1;
    VideoFormat video_format = 2;
    Ping ping = 3;
    Pong pong = 4;
    RequestKeyframe request_keyframe = 5;
    Auth auth = 6;
    AuthResult auth_result = 7;
    Feedback feedback = 8;
    Displays displays = 9;
    SelectDisplay select_display = 10;
    SetQuality set_quality = 11;
    Clipboard clipboard = 12;
    Chat chat = 13;
    FileReceived file_received = 14;
    ConfirmationPending confirmation_pending = 15;
    FsRequest fs_request = 16;
    FsResponse fs_response = 17;
    ViewSize view_size = 18;
    SetPrivacy set_privacy = 19;
    PrivacyState privacy_state = 20;
    Restart restart = 21;
    RestartState restart_state = 22;
    SetRecording set_recording = 23;
    RecordingState recording_state = 24;
    Permissions permissions = 25;
    ScreenState screen_state = 26;
  }
}

// From the agent, when it changes: the screen of the controlled computer is locked
// and its image cannot be captured (macOS shows no capture program its lock screen;
// GNOME stops remote desktop sessions while locked). Meanwhile the video is a dark
// placeholder. With `input` the keyboard and mouse still reach the lock screen
// (macOS): the viewer tells the technician to type the password; without it someone
// must unlock it at the computer.
message ScreenState {
  bool locked = 1;
  bool input = 2;
}

// From the viewer (only when Hello.recording from the agent): it starts or stops
// saving the session's video. The agent tells the person at the PC (a notice in the
// app) and answers RecordingState; the viewer writes only after `on` came back.
message SetRecording {
  bool on = 1;
}

// From the agent, after every SetRecording, and by itself when the person at the PC
// stops allowing recordings during the session (`on` false and `error`, "@key"
// messages are translated): the viewer then stops writing.
message RecordingState {
  bool on = 1;
  string error = 2;
}

// From the viewer (only when Hello.restart): restart the controlled computer. The
// agent answers RestartState; when it worked the session ends, and the viewer can
// wait for the computer to come back and connect again by itself.
message Restart {}

message RestartState {
  bool ok = 1;
  // Why not ("@key" messages are translated).
  string error = 2;
  // The same password will work after the restart without anyone at the computer
  // (permanent password, no confirmation required): the viewer can reconnect.
  bool reconnect = 3;
}

// From the viewer: privacy mode on or off (only when Hello.privacy_mode). The screen
// of the controlled PC turns black and its own mouse and keyboard are blocked, while
// the image streamed to the viewer stays the real one. It ends with the session.
message SetPrivacy {
  bool on = 1;
}

// From the agent, after every SetPrivacy: the state reached. With `on` false after a
// request to turn it on, `error` says why ("@key" messages are translated).
message PrivacyState {
  bool on = 1;
  string error = 2;
}

// File manager (viewer -> agent, on the control channel). On the agent the
// operations run as the user signed in on the PC, also when the agent is SYSTEM.
message FsRequest {
  uint32 id = 1;
  oneof op {
    // Folder to list; "" = drives and known folders (Desktop, Documents, Downloads).
    string list = 2;
    FsDownload download = 3;
    FsUploadOffset upload_offset = 4;
  }
}

// The agent sends the file on a unidirectional stream (FileChunk with
// transfer_id = the request id), from `offset` on (resuming an interrupted download).
message FsDownload {
  string path = 1;
  uint64 offset = 2;
}

// How much of `name` an interrupted upload already left in `dir` (resume).
message FsUploadOffset {
  string dir = 1;
  string name = 2;
}

message FsResponse {
  uint32 id = 1;
  // "" = done; otherwise the reason ("@key" messages are translated).
  string error = 2;
  // list: the folder listed and its contents.
  string path = 3;
  repeated FsEntry entries = 4;
  // upload_offset: bytes already received.
  uint64 offset = 5;
}

message FsEntry {
  string name = 1;
  string path = 2;
  bool dir = 3;
  uint64 size = 4;
  // Last change, seconds since 1970.
  int64 modified = 5;
}

// From the agent, after a correct temporary password, while the person at the PC
// decides (at most `timeout_s` seconds). Only to viewers of protocol version 2 or later.
message ConfirmationPending {
  uint32 timeout_s = 1;
}

// From the agent, at the end of every received file (see FileChunk).
message FileReceived {
  string name = 1;
  bool ok = 2;
  // With ok: where it was saved (e.g. "Downloads"); otherwise the reason.
  string message = 3;
  // File manager uploads: the transfer and the final path.
  uint32 transfer_id = 4;
  string path = 5;
}

// `file` channel (unidirectional stream viewer -> agent, one per file, opened after
// the input one; agent -> viewer for downloads, clipboard images and printed documents). The first message carries name and size, the following ones
// only data (at most 256 KB each). The end of the stream closes the file.
message FileChunk {
  string name = 1;
  uint64 size = 2;
  bytes data = 3;
  // In the first chunk: the stream carries an image copied to the clipboard (PNG),
  // to be written to the other side's clipboard instead of a file.
  bool clipboard_image = 4;
  // File manager (first chunk). Upload: destination folder ("" = Downloads) and
  // `offset` already there (the data starts from it). Download: the request id.
  string dir = 5;
  uint64 offset = 6;
  uint32 transfer_id = 7;
  // In the first chunk, agent -> viewer: the stream carries a document printed on the
  // agent's NuviraHub printer (PDF), `name` its title, to be printed at the viewer.
  bool print = 8;
}

// Chat message between the controlling side and the person at the PC (both directions).
message Chat {
  string text = 1;
}

// Text copied to the clipboard on one side, to be written to the other's
// clipboard (both directions, at most 1 MB). Images travel on their own stream
// (FileChunk with clipboard_image), not to hold up the control channel.
message Clipboard {
  string text = 1;
}

// From the agent, at the start of the session and at every change: the available
// screens and the one being streamed.
message Displays {
  repeated DisplayInfo displays = 1;
  // Index of the screen streamed, or 65535 for all the screens at once.
  uint32 current = 2;
  // The agent can stream all the screens at once (SelectDisplay 65535).
  bool all_available = 3;
}

message DisplayInfo {
  uint32 index = 1;
  string name = 2;
  uint32 width = 3;
  uint32 height = 4;
  bool primary = 5;
}

// From the viewer: stream this screen (index of DisplayInfo). The agent answers
// with updated VideoFormat and Displays.
message SelectDisplay {
  uint32 index = 1;
}

// From the viewer: trade-off between sharpness and smoothness. The bitrate stays
// adaptive; its cap and the frames per second change.
enum Quality {
  QUALITY_UNSPECIFIED = 0;
  // Default: the agent's maximum bitrate and fps.
  QUALITY_BALANCED = 1;
  // Sharper text: double maximum bitrate, at most 30 fps.
  QUALITY_SHARP = 2;
  // Slow networks: half maximum bitrate, full fps.
  QUALITY_FAST = 3;
}

message SetQuality {
  Quality quality = 1;
}

// From the viewer: pixels of the area the image is drawn in (sent again when it
// changes). A smaller area than the screen makes the agent encode a reduced image
// (fewer pixels: faster, less bandwidth, more bits for each pixel). 0x0 = the
// screen's own resolution (real-size view).
message ViewSize {
  uint32 width = 1;
  uint32 height = 2;
}

// From the viewer, every ~250 ms: what it sees of the session. The agent uses it to
// adapt the bitrate (rising latency = queued packets = saturated network).
message Feedback {
  // Capture→display latency in the interval (ms): median and minimum.
  uint32 latency_ms_p50 = 1;
  uint32 latency_ms_min = 2;
  uint32 frames = 3;
  uint32 window_ms = 4;
  // Network part only (ms): from the end of encoding to the arrival at the viewer,
  // without the agent's encoding and the viewer's decoding and drawing. The adaptive
  // bitrate uses it so that a slow encoder or graphics card is not taken for
  // congestion. Absent from older viewers.
  optional uint32 transit_ms_p50 = 5;
  optional uint32 transit_ms_min = 6;
  // Video as datagrams (Hello.video_datagrams), since the previous Feedback: shards
  // expected and lost, and frames that could not be rebuilt.
  optional uint32 shards = 7;
  optional uint32 shards_lost = 8;
  optional uint32 frames_lost = 9;
}

// Session password, sent by the viewer right after Hello when the agent asks for
// it. It travels only in the end-to-end encrypted channel: the server never sees it.
message Auth {
  string password = 1;
  // Instead of a password: the ticket of a support request this device made
  // (support queue). The person at the PC is always asked to accept.
  string support_ticket = 2;
}

message AuthResult {
  bool ok = 1;
  string message = 2;
}

message Hello {
  uint32 protocol_version = 1;
  string device_name = 2;
  string os = 3;
  string app_version = 4;
  // From the agent only: the viewer must send Auth before receiving video.
  bool password_required = 5;
  // From the agent: it answers FsRequest (file manager).
  bool file_manager = 6;
  // From the viewer: it can receive the video as QUIC datagrams with forward error
  // correction (nuvira_transport::fec). From the agent: the video comes that way.
  // Otherwise (older devices) it goes on the video stream.
  bool video_datagrams = 7;
  // From the agent: it can turn on privacy mode (SetPrivacy).
  bool privacy_mode = 8;
  // From the agent: it opens remote terminals (TerminalMessage).
  bool terminal = 9;
  // From the viewer: terminal only, no desktop. The agent does not capture the
  // screen and sends no VideoFormat; the viewer opens terminals (and tunnels).
  bool terminal_only = 10;
  // From the agent: it opens TCP tunnels towards its local network (TunnelOpen).
  bool tunnel = 11;
  // From the agent: it can restart the computer (Restart) and comes back by itself
  // afterwards (unattended access).
  bool restart = 12;
  // From the viewer: it prints documents of the agent (FileChunk.print). From the
  // agent: what is printed on its NuviraHub printer during the session reaches the
  // viewer.
  bool print = 13;
  // From the viewer: it can record the session (SetRecording). From the agent: the
  // person at the PC allows recordings, and is told when one starts.
  bool recording = 14;
  // From the agent: the server's rules want every session recorded (Policy.record_always).
  // The viewer records from the start and cannot stop; a viewer that does not
  // record is refused, and the session ends if the recording stops.
  bool recording_required = 15;
}

// From the agent, after AuthResult and whenever it changes: what the viewer may do
// now, after the server's rules, the limits of this session and what the person at
// the PC switched off (and back on) during it. Older agents never send it.
message Permissions {
  // Keyboard and mouse (off: the session only shows the screen).
  bool input = 1;
  bool clipboard = 2;
  // Sending files and the file manager.
  bool files = 3;
  bool terminal = 4;
  bool tunnel = 5;
  bool print = 6;
  // What the person at the PC switched off themselves (the rest is by the rules).
  repeated string switched_off = 7;
}

// First message of every bidirectional stream the viewer opens after the control
// one: what the stream is.
message StreamOpen {
  oneof kind {
    TerminalOpen terminal = 1;
    TunnelOpen tunnel = 2;
  }
}

// TCP tunnel: the agent connects to `host`:`port`, which must be in its local network
// (loopback, private, link-local addresses), and answers TunnelResult; after it the
// stream carries the raw bytes of the TCP connection in both directions.
message TunnelOpen {
  string host = 1;
  uint32 port = 2;
}

message TunnelResult {
  bool ok = 1;
  // Why not ("@key" messages are translated).
  string error = 2;
}

// `terminal` channel: a bidirectional stream opened by the viewer for each terminal,
// starting with StreamOpen.terminal; then `data` both ways and `resize` from the
// viewer. The agent ends with `exit` (shell ended or not started); closing the
// stream from the viewer ends the shell.
message TerminalMessage {
  reserved 1;
  oneof msg {
    // Bytes of the terminal: keys typed (viewer -> agent), output (agent -> viewer).
    bytes data = 2;
    TerminalSize resize = 3;
    TerminalExit exit = 4;
  }
}

// The shell runs as the user signed in on the PC (also when the agent is SYSTEM):
// PowerShell on Windows, the user's shell on Linux and macOS.
message TerminalOpen {
  TerminalSize size = 1;
}

message TerminalSize {
  uint32 cols = 1;
  uint32 rows = 2;
}

message TerminalExit {
  // Exit code of the shell, when it ran.
  int32 code = 1;
  // Why it did not start or was ended ("@key" messages are translated); "" = it ended by itself.
  string error = 2;
}

// Sent by the agent when the video stream starts (or changes).
message VideoFormat {
  Codec codec = 1;
  uint32 width = 2;
  uint32 height = 3;
}

// Estimate of RTT and of the difference between the two devices' clocks.
message Ping {
  uint64 sent_us = 1;
}

message Pong {
  uint64 ping_sent_us = 1;
  // Agent clock (microseconds since 1970) when it received the Ping.
  uint64 agent_us = 2;
}

message RequestKeyframe {}

// `video` channel (unidirectional stream agent -> viewer).
message VideoFrame {
  uint64 seq = 1;
  // Agent clock (microseconds since 1970) at capture time.
  uint64 capture_us = 2;
  uint32 encode_us = 3;
  bool keyframe = 4;
  bytes data = 5;
  // Agent clock (microseconds since 1970) when encoding finished: the viewer
  // measures the network part from here. 0 from older agents.
  uint64 encoded_us = 6;
}

// `input` channel (unidirectional stream viewer -> agent).
message InputEvent {
  oneof event {
    MouseMove mouse_move = 1;
    MouseButton mouse_button = 2;
    MouseWheel mouse_wheel = 3;
    Key key = 4;
    SecureAttention secure_attention = 5;
  }
}

// Ctrl+Alt+Del on the controlled device. It cannot be sent as keys: the viewer's
// system always intercepts it (in the viewer: Ctrl+Alt+End).
message SecureAttention {}

// Normalised 0..1 position relative to the streamed screen.
message MouseMove {
  float x = 1;
  float y = 2;
}

enum Button {
  BUTTON_UNSPECIFIED = 0;
  BUTTON_LEFT = 1;
  BUTTON_RIGHT = 2;
  BUTTON_MIDDLE = 3;
  BUTTON_BACK = 4;
  BUTTON_FORWARD = 5;
}

message MouseButton {
  Button button = 1;
  bool down = 2;
}

// Wheel in units of 120 per notch (like Windows' WHEEL_DELTA).
message MouseWheel {
  int32 dx = 1;
  int32 dy = 2;
}

// Physical key, identified by the W3C name of KeyboardEvent.code
// (e.g. "KeyA", "Enter", "ControlLeft", "MetaLeft"): independent of the
// keyboard layout and the same the web client will use.
message Key {
  string code = 1;
  bool down = 2;
}
