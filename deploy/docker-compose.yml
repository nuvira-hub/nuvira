# nexodesk-server: segnalazione e relay. Aprire/inoltrare la porta UDP 21116.
services:
  nexodesk-server:
    image: ghcr.io/alexbn71/nexodesk-server:latest
    container_name: nexodesk-server
    restart: unless-stopped
    ports:
      - "21116:21116/udp"
    environment:
      NEXODESK_LOG: info
    volumes:
      - nexodesk-data:/data

volumes:
  nexodesk-data:
