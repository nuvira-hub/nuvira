# nuvira-server: signalling and relay. Open/forward UDP port 21116, and TCP 21116
# for the WebSocket fallback (networks that block UDP).
services:
  nuvira-server:
    image: ghcr.io/nuvira-hub/nuvira-server:latest
    container_name: nuvira-server
    restart: unless-stopped
    ports:
      - "21116:21116/udp"
      - "21116:21116/tcp"
    environment:
      NUVIRA_LOG: info
    volumes:
      - nuvira-data:/data

volumes:
  nuvira-data:
