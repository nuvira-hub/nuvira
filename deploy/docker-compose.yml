# nuvira-server: signalling and relay. Open/forward UDP port 21116, and TCP 21116
# for the WebSocket fallback (networks that block UDP).
services:
  nuvira-server:
    image: ghcr.io/alexbn71/nuvira-server:latest
    container_name: nuvira-server
    restart: unless-stopped
    ports:
      - "21116:21116/udp"
      - "21116:21116/tcp"
    environment:
      NUVIRA_LOG: info
      # First address book administrator (only if no account exists yet); without
      # a password a random one is written once to the log.
      # NUVIRA_ADMIN_USER: admin
      # NUVIRA_ADMIN_PASSWORD: change-me
    volumes:
      - nuvira-data:/data

volumes:
  nuvira-data:
