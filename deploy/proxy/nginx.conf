# nginx in front of nuvira-server (TCP 21116): status page, WebSocket /nuvira,
# update files and, with NuviraHub Pro, web console, web client, invitations and
# REST API. UDP 21116 does not go through here: forward it to the server directly.
#
# The certificate paths are certbot's; nuvira-server is the container's name on
# the same Docker network as nginx (with nginx on the host use 127.0.0.1:21116).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    http2 on;
    server_name nuvira.example.com;
    ssl_certificate     /etc/letsencrypt/live/nuvira.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nuvira.example.com/privkey.pem;

    location / {
        proxy_pass http://nuvira-server:21116;
        proxy_http_version 1.1;
        # WebSocket tunnel of the apps and of the web client.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # The server counts its limits by the last address of this header.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The Pro console accepts sign-in from the Internet only over HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
        # A session can stay quiet for a while: the default 60 s would cut it.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
        # Uploads of the Pro console (installer logos) and of the web client.
        client_max_body_size 0;
    }
}

server {
    listen 80;
    server_name nuvira.example.com;
    return 301 https://$host$request_uri;
}
