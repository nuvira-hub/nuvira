[workspace]
resolver = "3"
members = [
    "client/proto",
    "client/capture",
    "client/codec",
    "client/transport",
    "client/input",
    "client/agent",
    "client/viewer",
    "client/app",
    "client/service",
    "client/clipboard",
    "client/i18n",
    "client/update",
    "client/secret",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Alessandro Blason"]
repository = "https://github.com/alexbn71/NexoDesk"

[workspace.dependencies]
nexodesk-proto = { path = "client/proto" }
nexodesk-transport = { path = "client/transport" }
nexodesk-capture = { path = "client/capture" }
nexodesk-codec = { path = "client/codec" }
nexodesk-input = { path = "client/input" }
nexodesk-clipboard = { path = "client/clipboard" }
nexodesk-i18n = { path = "client/i18n" }

anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nu-ansi-term = "0.50"
openh264 = "0.9"
wgpu = "30"
winit = "0.30"
softbuffer = "0.4"
png = "0.18"
pollster = "1"
bytemuck = { version = "1", features = ["derive"] }
windows = "0.62"
