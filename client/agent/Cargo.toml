[package]
name = "nuvira-agent"
description = "NuviraHub: the controlled device (agent library and command-line program)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "nuvira_agent"
path = "src/lib.rs"

[[bin]]
name = "nuvira-agent"
path = "src/main.rs"

[dependencies]
nuvira-secret = { path = "../secret" }
anyhow.workspace = true
clap.workspace = true
nuvira-capture.workspace = true
nuvira-clipboard.workspace = true
nuvira-codec.workspace = true
nuvira-input.workspace = true
nuvira-proto.workspace = true
nuvira-transport.workspace = true
quinn.workspace = true
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { workspace = true, features = ["net", "fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
nu-ansi-term.workspace = true

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Shell",
]
