[package]
name = "nuvira-service"
description = "NuviraHub: system service for unattended access"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
nuvira-secret = { path = "../secret" }
anyhow.workspace = true
clap.workspace = true
nuvira-update = { path = "../update" }
nuvira-proto.workspace = true
nuvira-transport.workspace = true
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nuvira-capture.workspace = true
nuvira-input.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
nuvira-cups.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Printing",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_RemoteDesktop",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
