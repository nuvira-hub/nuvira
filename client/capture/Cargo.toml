[package]
name = "nuvira-capture"
description = "Screen capture with each system's native APIs"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
nuvira-proto.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
]

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
nuvira-portal = { path = "../portal" }
nuvira-transport.workspace = true
pipewire = "0.10"
x11rb = { version = "0.13", features = ["randr", "xfixes"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
libc = "0.2"
screencapturekit = "11.1"
