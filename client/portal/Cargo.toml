[package]
name = "nuvira-portal"
description = "Remote desktop session through xdg-desktop-portal (Wayland): screen and input"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
anyhow.workspace = true
ashpd = { version = "0.13", default-features = false, features = ["tokio", "remote_desktop", "screencast"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
libc = "0.2"
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "net"] }
tracing.workspace = true
wayland-client = "0.31"
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
