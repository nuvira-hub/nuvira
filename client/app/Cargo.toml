[package]
name = "nuvira-app"
description = "NuviraHub: desktop application (ID, password, confirming connections, starting sessions, address book)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "nuvira"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
nuvira-agent = { path = "../agent" }
nuvira-service = { path = "../service" }
nuvira-update = { path = "../update" }
nuvira-viewer = { path = "../viewer" }
nuvira-codec.workspace = true
nuvira-i18n.workspace = true
nuvira-input.workspace = true
nuvira-proto.workspace = true
nuvira-transport.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = ["Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console"]
