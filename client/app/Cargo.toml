[package]
name = "nuvira-app"
description = "NuviraHub: desktop application (ID, password, confirming connections, starting sessions, address book)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "nuvira"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
nuvira-agent = { path = "../agent" }
nuvira-secret = { path = "../secret" }
nuvira-service = { path = "../service" }
nuvira-update = { path = "../update" }
nuvira-viewer = { path = "../viewer" }
nuvira-capture.workspace = true
nuvira-codec.workspace = true
nuvira-i18n.workspace = true
nuvira-input.workspace = true
nuvira-proto.workspace = true
nuvira-transport.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# nuvirahub:// links (invitations, docs/47-invitations.md), handed to the running app.
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-single-instance = { version = "2.5.5", features = ["deep-link"] }
url = "2"
qrcodegen = "1.8"
rfd = "0.15"
ring = "0.17"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"]

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
