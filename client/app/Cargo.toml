[package]
name = "nexodesk-app"
description = "NexoDesk: applicazione desktop (ID, password, conferma dei collegamenti, avvio delle sessioni)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "nexodesk"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
nexodesk-agent = { path = "../agent" }
nexodesk-codec.workspace = true
nexodesk-i18n.workspace = true
nexodesk-input.workspace = true
nexodesk-proto.workspace = true
nexodesk-transport.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
