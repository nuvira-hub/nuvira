[package]
name = "nuvira-input"
description = "Mouse and keyboard injection on the controlled device"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
nuvira-proto.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies.windows]
workspace = true
features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(target_os = "linux")'.dependencies]
nuvira-portal = { path = "../portal" }
libc = "0.2"
x11rb = { version = "0.13", features = ["randr", "xinput", "xtest"] }
# Text on Wayland: the compositor's keymap (wl_keyboard), compiled with libxkbcommon
# loaded at run time (the same crates winit uses).
wayland-client = "0.31"
xkbcommon-dl = "0.4"
# IBus's signals for the Unicode entry (ibus_watch.rs).
futures-util = "0.3"
# Privacy mode on Wayland: Mutter's DisplayConfig (zbus as ashpd builds it, on tokio).
tokio = { workspace = true, features = ["rt"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = { version = "0.25", features = ["highsierra"] }
dispatch2 = "0.3"
foreign-types = "0.5"
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
