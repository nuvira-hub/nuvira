<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: dark; --bg: #1f252b; --panel: #272e35; --line: #39424c; --text: #e6eaee; --muted: #9aa5b1; --accent: #2a9bc4; --danger: #f2b8b5; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 "Segoe UI", system-ui, sans-serif; }
  main { padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  h1 { font-size: 16px; margin: 0; }
  .doc { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; gap: 12px; align-items: center; }
  .doc svg { flex: none; color: var(--accent); }
  .doc .name { font-weight: 600; word-break: break-word; }
  .hint { color: var(--muted); margin: 0; font-size: 12px; }
  label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 12px; }
  label.check { flex-direction: row; align-items: center; gap: 8px; color: var(--text); font-size: 13px; }
  select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 7px 8px; font: inherit; appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 16px) 50%, calc(100% - 11px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 28px; }
  option { background: var(--panel); color: var(--text); }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 7px 14px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .none { color: var(--danger); margin: 0; }
  .hidden { display: none; }
</style>
</head>
<body>
<main>
  <h1 data-i18n="pr.heading">The remote computer printed a document</h1>
  <div class="doc">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 14h12v7H6z"/></svg>
    <div>
      <div class="name" id="name"></div>
      <div class="hint" id="details"></div>
    </div>
  </div>
  <p class="none hidden" id="none" data-i18n="pr.no_printers">There is no printer on this computer: save the document as PDF.</p>
  <label id="printer-label"><span data-i18n="pr.printer">Printer</span><select id="printer"></select></label>
  <label class="check" id="automatic-label"><input type="checkbox" id="automatic"> <span data-i18n="pr.automatic">From now on print on this printer without asking</span></label>
  <p class="hint" id="waiting"></p>
  <div class="actions">
    <button type="button" id="cancel" data-i18n="pr.cancel">Don't print</button>
    <button type="button" id="save" data-i18n="pr.save">Save as PDF…</button>
    <button type="button" class="primary" id="print" data-i18n="pr.print">Print</button>
  </div>
</main>
<script>
  const STRINGS = window.I18N || {};
  const t = (key, args = {}) => (STRINGS[key] || key).replace(/\{(\w+)\}/g, (_, k) => args[k] ?? "");
  for (const node of document.querySelectorAll("[data-i18n]")) node.textContent = t(node.dataset.i18n);
  const send = (msg) => window.ipc.postMessage(JSON.stringify(msg));
  const $ = (id) => document.getElementById(id);
  let current = 0;

  const size = (bytes) => bytes < 1024 * 1024 ? `${Math.max(1, Math.round(bytes / 1024))} KB` : `${(bytes / 1024 / 1024).toFixed(1)} MB`;

  $("print").addEventListener("click", () => send({ op: "print", id: current, printer: $("printer").value, automatic: $("automatic").checked }));
  $("save").addEventListener("click", () => send({ op: "save", id: current }));
  $("cancel").addEventListener("click", () => send({ op: "cancel", id: current }));
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") send({ op: "cancel", id: current });
  });

  window.pr = {
    update(state) {
      current = state.id;
      $("name").textContent = state.name;
      $("details").textContent = t("pr.details", { size: size(state.size), agent: state.agent });
      const select = $("printer");
      select.replaceChildren(...state.printers.map((p) => new Option(p, p, false, p === state.selected)));
      const none = state.printers.length === 0;
      $("none").classList.toggle("hidden", !none);
      $("printer-label").classList.toggle("hidden", none);
      $("automatic-label").classList.toggle("hidden", none);
      $("print").disabled = none;
      $("waiting").textContent = state.waiting > 0 ? t("pr.waiting", { count: state.waiting }) : "";
      (none ? $("save") : $("print")).focus();
    },
  };
  send({ op: "ready" });
</script>
</body>
</html>
