<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* Drop-down menu of the session toolbar (toolbar.rs, Menu): a WebView of its own
     under the button, as the toolbar's WebView is only as tall as the bar. */
  :root {
    --bg: #ffffff;
    --edge: #0c4f66;
    --text: #1d2a30;
    --muted: #5b6b72;
    --hover: #e3f1f6;
    --check: #136e8c;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.25 "Segoe UI", system-ui, sans-serif;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }
  body { box-shadow: inset 0 0 0 1px var(--edge); padding: 4px; }
  button {
    display: grid; grid-template-columns: 18px 1fr; column-gap: 6px; align-items: start;
    width: 100%; height: 40px; padding: 4px 8px; text-align: left;
    border: 0; border-radius: 6px; background: transparent; color: inherit;
    font: inherit; cursor: pointer;
  }
  button:hover, button:focus-visible { background: var(--hover); outline: none; }
  .check { grid-row: span 2; color: var(--check); font-weight: 700; padding-top: 1px; }
  .label { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hint { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div id="items" role="menu"></div>
<script>
  const STRINGS = window.I18N || {};
  const t = (key) => STRINGS[key] || key;
  const send = (action) => window.ipc.postMessage(action);
  let open = false;
  const close = () => {
    if (open) {
      open = false;
      send("menuclose");
    }
  };
  // A click elsewhere (the session, the toolbar) or Esc closes it.
  window.addEventListener("blur", close);
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") close();
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      const all = [...document.querySelectorAll("button")];
      const i = all.indexOf(document.activeElement);
      const next = e.key === "ArrowDown" ? (i + 1) % all.length : (i - 1 + all.length) % all.length;
      all[next].focus();
      e.preventDefault();
    }
  });

  window.nuvira = {
    // items: [{action, label, hint, checked}], label and hint as string keys.
    show(items) {
      const box = document.getElementById("items");
      box.replaceChildren();
      for (const item of items) {
        const b = document.createElement("button");
        b.setAttribute("role", "menuitemradio");
        b.setAttribute("aria-checked", String(Boolean(item.checked)));
        const check = document.createElement("span");
        check.className = "check";
        check.textContent = item.checked ? "✓" : "";
        const label = document.createElement("span");
        label.className = "label";
        label.textContent = t(item.label);
        const hint = document.createElement("span");
        hint.className = "hint";
        // The toolbar's hints start with the name ("Sharp: crisper text"): the rest.
        const full = item.hint ? t(item.hint) : "";
        const colon = full.search(/\s?:\s/);
        hint.textContent = colon > 0 ? full.slice(full.indexOf(":", colon) + 1).trim() : full;
        b.append(check, label, hint);
        b.title = full;
        b.addEventListener("click", () => {
          open = false;
          send(item.action);
          send("menuclose");
        });
        box.append(b);
      }
      open = true;
      (box.querySelector('[aria-checked="true"]') || box.firstChild)?.focus();
    },
  };
</script>
</body>
</html>
