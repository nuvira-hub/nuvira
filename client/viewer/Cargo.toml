[package]
name = "nuvira-viewer"
description = "NuviraHub: remote session window (wgpu)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "nuvira-viewer"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bytemuck.workspace = true
clap.workspace = true
nuvira-clipboard.workspace = true
nuvira-codec.workspace = true
nuvira-i18n.workspace = true
nuvira-proto.workspace = true
nuvira-transport.workspace = true
prost.workspace = true
quinn.workspace = true
pollster.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { workspace = true, features = ["fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true
wgpu.workspace = true
winit.workspace = true
softbuffer.workspace = true
wry = "0.57"
rfd = "0.15"
png.workspace = true

[target.'cfg(windows)'.dependencies]
nu-ansi-term.workspace = true
windows = { workspace = true, features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# The WebViews (toolbar, chat, file manager) are GTK widgets: GTK must be started
# and its events handled in the winit loop.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
