[package]
name = "nuvira-transport"
description = "Session network transport (QUIC)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
nuvira-proto.workspace = true
prost.workspace = true
quinn.workspace = true
rcgen.workspace = true
rustls.workspace = true
sha2.workspace = true
tokio.workspace = true
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
webpki-roots = "1"
tracing.workspace = true
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["alloc", "ring"] }

[dev-dependencies]
ring = "0.17"
