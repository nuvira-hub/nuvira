[package]
name = "nuvira-audio"
description = "Remote audio: capture of what the computer plays, Opus, playback"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
tracing.workspace = true
cpal = "0.18"
unsafe-libopus = "0.2"
rubato = "0.16"

[target.'cfg(target_os = "linux")'.dependencies]
# libpulse-simple, loaded at run time (capture of the monitor).
libloading = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
# System audio of the stream (the screen capture uses the same crate).
screencapturekit = "11.1"
