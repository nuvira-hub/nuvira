name: nuvira-linux

# Builds nuvira-linux-x64.tar.gz, the .deb and the .rpm on Ubuntu 22.04, the oldest
# distribution we support: the binary needs a glibc at least as new as the build
# one. The PipeWire bindings need the headers of PipeWire 0.3.65 (Ubuntu 22.04 has
# 0.3.48): tools/pipewire-headers.sh puts them next to the system's library, which
# the program is linked against, so a successful link means it runs on 0.3.48 too.
# The packages are a workflow artifact; they go into the release by hand, together
# with the signed Windows files.
on:
  push:
    branches: [main]
    paths: ['client/**', 'proto/**', 'Cargo.*', 'tools/package-linux.sh', '.github/workflows/client-linux.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest
    container: docker.io/library/ubuntu:22.04
    env:
      DEBIAN_FRONTEND: noninteractive
      PKG_CONFIG_PATH: /opt/pw/pkgconfig
    steps:
      - name: System packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl wget git build-essential pkg-config nasm file \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libpipewire-0.3-dev libspa-0.2-dev clang libclang-dev \
            libasound2-dev

      - uses: actions/checkout@v4

      - name: Rust
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: PipeWire 0.3.65 headers
        run: sh tools/pipewire-headers.sh /opt/pw

      - name: nfpm
        run: |
          wget -q https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_amd64.deb
          dpkg -i nfpm_2.47.0_amd64.deb

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --release

      - name: Package
        run: tools/package-linux.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: nuvira-linux-x64
          path: |
            dist/nuvira-linux-x64.tar.gz
            dist/nuvira-linux-x64.deb
            dist/nuvira-linux-x64.rpm
          if-no-files-found: error
