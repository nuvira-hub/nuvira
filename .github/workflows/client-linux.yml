name: nuvira-linux

# Builds nuvira-linux-x64.tar.gz, the .deb and the .rpm on Debian 12, the oldest
# distribution we support: the binary needs a glibc at least as new as the build
# one (2.36), and the PipeWire bindings a PipeWire at least 0.3.65 (Ubuntu 22.04
# has 0.3.48). The packages are a workflow artifact; they go into the release by
# hand, together with the signed Windows files.
on:
  push:
    branches: [main]
    paths: ['client/**', 'proto/**', 'Cargo.*', 'tools/package-linux.sh', '.github/workflows/client-linux.yml']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest
    container: docker.io/library/rust:1-bookworm
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config nasm file \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libpipewire-0.3-dev libspa-0.2-dev clang libclang-dev \n            libasound2-dev

      - name: nfpm
        run: |
          wget -q https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_amd64.deb
          dpkg -i nfpm_2.47.0_amd64.deb

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --workspace --release

      - name: Package
        run: tools/package-linux.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: nuvira-linux-x64
          path: |
            dist/nuvira-linux-x64.tar.gz
            dist/nuvira-linux-x64.deb
            dist/nuvira-linux-x64.rpm
          if-no-files-found: error
