name: macos-signing-check

# Checks the Apple signing chain without building NuviraHub: imports the
# Developer ID certificate from the secrets, signs a tiny program with the
# hardened runtime and has Apple notarize it. Started by hand only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    steps:
      - name: Certificate into a temporary keychain
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpw=$(openssl rand -hex 16)
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$kc"

      - name: Sign a test program
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          printf 'int main(void){return 0;}\n' > hello.c
          clang -arch arm64 -arch x86_64 -o hello hello.c
          codesign --force --options runtime --timestamp \
            --sign "Developer ID Application: Alessandro Blason ($APPLE_TEAM_ID)" hello
          codesign --verify --strict --verbose=2 hello
          codesign -dv hello 2>&1 | grep -E "Authority|TeamIdentifier|Runtime"

      - name: Notarize
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$key"
          ditto -c -k --keepParent hello hello.zip
          xcrun notarytool submit hello.zip --key "$key" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" --wait --timeout 20m
          rm "$key"

      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
