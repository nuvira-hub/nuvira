name: nuvira-macos

# Builds NuviraHub for macOS: tests, then NuviraHub.app (universal) in
# nuvira-macos.dmg, signed with the Developer ID certificate and notarized by
# Apple. The .dmg is a workflow artifact; it goes into the release by hand.
# Started by hand, and at every tag.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build and package
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: brew install nasm librsvg

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --release --workspace

      - name: Certificate into a temporary keychain
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpw=$(openssl rand -hex 16)
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 3600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpw" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')

      - name: Package
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          export NUVIRA_SIGN_IDENTITY="Developer ID Application: Alessandro Blason ($APPLE_TEAM_ID)"
          tools/package-macos.sh dist

      # The first notarizations of an account can take hours: the .dmg is kept
      # also when Apple has not answered yet (it is then signed, not stapled).
      - name: Notarize
        continue-on-error: true
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          echo "$APPLE_API_KEY_P8" | base64 --decode > "$key"
          xcrun notarytool submit dist/nuvira-macos.dmg --key "$key" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" --wait --timeout 30m
          rm "$key"
          xcrun stapler staple dist/nuvira-macos.dmg
          spctl --assess --type open --context context:primary-signature -v dist/nuvira-macos.dmg

      - name: Remove the keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - uses: actions/upload-artifact@v4
        with:
          name: nuvira-macos
          path: |
            dist/nuvira-macos.dmg
            dist/nuvira-macos-app.zip
          if-no-files-found: error
