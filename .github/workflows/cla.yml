name: cla

# Contributor licence agreement (CLA.md): on every pull request a bot checks
# that its authors accepted the agreement, and asks the others to accept it
# with a comment. Signatures are kept in signatures/cla.json on the
# cla-signatures branch of this repository; no external service.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/nuvira-hub/nuvira/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: dependabot[bot],github-actions[bot]
          lock-pullrequest-aftermerge: false
          custom-notsigned-prcomment: >-
            Thank you for your contribution! NuviraHub is free software (AGPL) and also the base of NuviraHub Pro:
            before we can merge it, please read the [Contributor Licence Agreement](https://github.com/nuvira-hub/nuvira/blob/main/CLA.md)
            (you keep the copyright of your work) and accept it by commenting with the sentence below. You only do this once.
          custom-allsigned-prcomment: All contributors have accepted the CLA. Thank you!
