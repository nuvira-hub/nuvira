name: nexodesk-server

on:
  push:
    branches: [main]
    paths: ['server/**', 'proto/**', '.github/workflows/server.yml']
    tags: ['v*']
  pull_request:
    paths: ['server/**', 'proto/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nexodesk-server

defaults:
  run:
    working-directory: server

jobs:
  test:
    name: Vet e test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test ./...

  image:
    name: Immagine Docker
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Build per la prova
        uses: docker/build-push-action@v7
        with:
          context: server
          platforms: linux/amd64
          load: true
          tags: nexodesk-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prova del container
        working-directory: .
        run: |
          docker run -d --name smoke -p 21116:21116/udp nexodesk-server:ci
          for i in $(seq 1 20); do docker exec smoke /nexodesk-server healthcheck && break; sleep 1; done
          docker exec smoke /nexodesk-server healthcheck
          docker logs smoke 2>&1 | grep -q 'nexodesk-server avviato'
          docker rm -f smoke

      - name: Login a ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag
        if: github.event_name != 'pull_request'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build e pubblicazione (amd64 + arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
